<!DOCTYPE html>
<html lang="pt-br"
		xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{_layouts/base}"
		th:with="htmlTitle='Tarefas'">
	<head>
		<title th:text="${htmlTitle}"></title>
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				document.addEventListener("click", async (e) => {
					const linkExcluir = e.target.closest(".acao-excluir");
					if (linkExcluir) {
						e.preventDefault();
						const id = linkExcluir.dataset.id;
						if (await Ui.confirma("Tem certeza que deseja excluir esta tarefa?")) {
							Ui.showLoading();
							$.ajax({
								url: "/api/v1/tarefa/" + id,
								type: "DELETE",
								success: function () {
									Ui.sucesso("Tarefa excluída com sucesso");
									linkExcluir.closest("tr").remove();
									Ui.hideLoading();
								},
								error: function (xhr) {
									Ui.erro(xhr.responseJSON ? xhr.responseJSON.mensagem : xhr.statusText);
									Ui.hideLoading();
								}
							});
						}
					}

					const chkMarcar = e.target.closest(".acao-marcar");
					if (chkMarcar) {
						e.preventDefault();
						const id = chkMarcar.dataset.id;
						Ui.showLoading();
						$.ajax({
							url: "/api/v1/tarefa/" + id + "/marcar",
							type: "PATCH",
							success: function () {
								chkMarcar.checked = true;
								chkMarcar.classList.replace("acao-marcar", "acao-desmarcar");
								Ui.hideLoading();
							},
							error: function (xhr) {
								Ui.erro(xhr.responseJSON ? xhr.responseJSON.mensagem : xhr.statusText);
								Ui.hideLoading();
							}
						});
					}

					const chkDesmarcar = e.target.closest(".acao-desmarcar");
					if (chkDesmarcar) {
						e.preventDefault();
						const id = chkDesmarcar.dataset.id;
						Ui.showLoading();
						$.ajax({
							url: "/api/v1/tarefa/" + id + "/desmarcar",
							type: "PATCH",
							success: function () {
								chkDesmarcar.checked = false;
								chkDesmarcar.classList.replace("acao-desmarcar", "acao-marcar");
								Ui.hideLoading();
							},
							error: function (xhr) {
								Ui.erro(xhr.responseJSON ? xhr.responseJSON.mensagem : xhr.statusText);
								Ui.hideLoading();
							}
						});
					}
				});
			});
		</script>
	</head>
	<body>
		<div layout:fragment="conteudo">
			<nav>
				<ol class="breadcrumb">
					<li th:replace="~{_fragments :: breadcrumb_index()}"></li>
					<li th:replace="~{tarefa/_fragments :: breadcrumb_index(active=true)}"></li>
				</ol>
			</nav>
			<h1>
				<span>
					<img src="/img/tarefa-32.png">
					<span th:text="${htmlTitle}"></span>
				</span>
			</h1>
			<div id="crudLista" class="mb-3">
				<table class="table table-sm table-hover">
					<thead>
						<th:block th:replace="~{tarefa/_fragments :: theadTr()}"></th:block>
					</thead>
					<th:block th:if="${!#lists.isEmpty(tarefas)}">
						<tbody>
							<th:block th:each="tarefa : ${tarefas}">
								<th:block th:replace="~{tarefa/_fragments :: tbodyTr(tarefa=${tarefa})}"></th:block>
							</th:block>
						</tbody>
					</th:block>
				</table>
			</div>
			<th:block th:if="${#lists.isEmpty(tarefas)}">
				<p>Não há tarefas cadastradas.</p>
			</th:block>
		</div>
	</body>
</html>
